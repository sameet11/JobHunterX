version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: jobhunterx-db
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter_dev_password
      POSTGRES_DB: jobhunterx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunterx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobhunterx-network

  # pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jobhunterx-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jobhunterx.local
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobhunterx-network

  # JobHunterX Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobhunterx-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # GCP/Vertex AI Configuration (uses ADC from ~/.config/gcloud)
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_REGION: ${GOOGLE_CLOUD_REGION:-us-central1}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash-001}

      # LinkedIn Credentials (Phase 3b outreach only — only needed when linkedin_outreach_backend=linkedin_api)
      LINKEDIN_EMAIL: ${LINKEDIN_EMAIL}
      LINKEDIN_PASSWORD: ${LINKEDIN_PASSWORD}

      # Naukri Credentials
      NAUKRI_EMAIL: ${NAUKRI_EMAIL}
      NAUKRI_PASSWORD: ${NAUKRI_PASSWORD}

      # Database (use Docker service name)
      DATABASE_URL: postgresql://jobhunter:jobhunter_dev_password@postgres:5432/jobhunterx

      # Google Sheets (OAuth)
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID}

      # APIs
      HUNTER_API_KEY: ${HUNTER_API_KEY}
      GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}

      # Settings
      DAILY_LIMIT: ${DAILY_LIMIT:-15}
      MIN_MATCH_SCORE: ${MIN_MATCH_SCORE:-40}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Persistent data
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs

      # GCP ADC (Application Default Credentials) from local gcloud config
      - ~/.config/gcloud:/root/.config/gcloud:ro

      # Google Sheets OAuth token
      - ./data/google_sheets_token.json:/app/data/google_sheets_token.json

      # Playwright browser profile — Naukri session persistence
      - ./data/naukri_profile:/app/data/naukri_profile

      # .env file for local overrides
      - ./.env:/app/.env:ro
    stdin_open: true
    tty: true
    networks:
      - jobhunterx-network

volumes:
  postgres_data:
    driver: local

networks:
  jobhunterx-network:
    driver: bridge
